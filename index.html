                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </>
                        )}

                        {currentView === 'my-documents' && (
                            <div className="space-y-8 pb-10">
                                {displayedSectors.map((sector, idx) => {
                                    const sectorDocs = activeDocuments.filter(doc => doc.category === sector.name);
                                    return (
                                        <div key={idx} className="bg-white rounded-3xl shadow-xl border border-gray-100 overflow-hidden opacity-0" style={{ animation: `fadeInUp 0.5s cubic-bezier(0.4, 0, 0.2, 1) ${idx * 0.1}s forwards` }}>
                                            <div className={`p-6 border-b border-gray-100 flex items-center justify-between bg-slate-50`}>
                                                <div className="flex items-center">
                                                    <div className={`w-12 h-12 rounded-2xl flex items-center justify-center mr-5 shadow-sm border border-gray-200 ${sector.bg} ${sector.color}`}><i className={`fa-solid ${sector.icon} text-xl`}></i></div>
                                                    <div><h3 className="text-xl font-extrabold text-gray-900">{sector.name}</h3><p className="text-sm font-bold text-gray-400 uppercase tracking-widest mt-0.5">{sectorDocs.length} RECORDS</p></div>
                                                </div>
                                                {activeSector !== 'All' && <button onClick={() => navigateTo('my-documents', 'All')} className="text-sm text-sky-600 hover:bg-sky-50 px-4 py-2 rounded-lg font-bold transition-colors">Show All Sectors</button>}
                                            </div>
                                            {sectorDocs.length === 0 ? (
                                                <div className="p-12 text-center text-gray-400"><i className="fa-solid fa-radar text-4xl mb-3 text-gray-300"></i><p className="font-bold text-sm">No records logged in {sector.name}</p></div>
                                            ) : (
                                                <div className="overflow-x-auto">
                                                    <table className="w-full text-left border-collapse">
                                                        <tbody>
                                                            {sectorDocs.map(doc => {
                                                                const isDeleting = animatingIds.delete.includes(doc.id);
                                                                return (
                                                                    <tr key={doc.id} className={`border-b border-gray-50 table-row-animated last:border-b-0 cursor-pointer ${isDeleting ? 'animate-delete' : ''}`} onClick={() => setViewingDoc(doc)}>
                                                                        <td className="p-5 w-14 text-center" onClick={e => e.stopPropagation()}><button onClick={(e) => toggleFavorite(e, doc.id)} className="text-gray-300 hover:text-yellow-400 focus:outline-none transition-colors"><i className={`fa-star text-xl ${doc.isFavorite ? 'fa-solid text-yellow-400' : 'fa-regular'}`}></i></button></td>
                                                                        <td className="p-5 pl-2 flex items-center w-1/2">
                                                                            <div className={`w-10 h-10 flex-shrink-0 rounded-xl flex items-center justify-center mr-4 shadow-sm ${doc.name.includes('.pdf') ? 'bg-red-50 text-red-500 border border-red-100' : 'bg-green-50 text-green-500 border border-green-100'}`}><i className={`fa-solid fa-file${doc.name.includes('.pdf') ? '-pdf' : '-image'} text-lg`}></i></div>
                                                                            
                                                                            {renamingDocId === doc.id ? (
                                                                                <div className="flex items-center w-full relative" onClick={e => e.stopPropagation()}>
                                                                                    <input 
                                                                                        type="text" 
                                                                                        value={newDocName} 
                                                                                        onChange={(e) => setNewDocName(e.target.value)}
                                                                                        className="w-full px-3 py-1.5 border-2 border-blue-400 rounded-lg focus:outline-none text-sm font-bold text-gray-900 pr-16 bg-white shadow-sm"
                                                                                        autoFocus
                                                                                        onKeyDown={(e) => { if(e.key === 'Enter') saveRename(e, doc.id); if(e.key === 'Escape') cancelRename(e); }}
                                                                                    />
                                                                                    <div className="absolute right-1 flex gap-1">
                                                                                        <button onClick={(e) => saveRename(e, doc.id)} className="w-6 h-6 bg-blue-100 text-blue-600 rounded hover:bg-blue-200"><i className="fa-solid fa-check text-xs"></i></button>
                                                                                        <button onClick={cancelRename} className="w-6 h-6 bg-gray-100 text-gray-500 rounded hover:bg-gray-200"><i className="fa-solid fa-xmark text-xs"></i></button>
                                                                                    </div>
                                                                                </div>
                                                                            ) : (
                                                                                <span className="font-bold text-gray-900 truncate">{doc.name}</span>
                                                                            )}

                                                                        </td>
                                                                        <td className="p-5 text-gray-500 text-sm font-medium">{doc.date}</td>
                                                                        <td className="p-5 text-gray-500 text-sm font-bold bg-gray-50/50">{doc.size}</td>
                                                                        <td className="p-5 text-right pr-6 whitespace-nowrap" onClick={e => e.stopPropagation()}>
                                                                            <button onClick={(e) => startRename(e, doc.id, doc.name)} className="text-gray-400 hover:text-amber-500 hover:bg-amber-50 w-10 h-10 rounded-xl transition-all btn-action-hover mx-1" title="Rename"><i className="fa-solid fa-pen"></i></button>
                                                                            {doc.fileUrl && !doc.isMock && <a href={doc.fileUrl} download={doc.name} className="text-gray-400 hover:text-emerald-600 hover:bg-emerald-50 inline-flex items-center justify-center w-10 h-10 rounded-xl transition-all btn-action-hover mx-1" title="Download"><i className="fa-solid fa-download"></i></a>}
                                                                            <button onClick={(e) => moveToTrash(e, doc.id)} className="text-gray-400 hover:text-red-600 hover:bg-red-50 w-10 h-10 rounded-xl transition-all btn-action-hover mx-1" title="Move to Recycle Bin"><i className="fa-solid fa-trash"></i></button>
                                                                        </td>
                                                                    </tr>
                                                                )
                                                            })}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            )}
                                        </div>
                                    )
                                })}
                            </div>
                        )}
                        
                        {currentView === 'favorites' && (
                            <div className="bg-white rounded-3xl shadow-xl border border-gray-100 overflow-hidden">
                                {favoriteDocs.length === 0 ? (
                                    <div className="p-20 text-center text-gray-500"><i className="fa-regular fa-star text-6xl mb-5 text-gray-300"></i><p className="text-xl font-extrabold text-gray-800 mb-2">No Priority Data</p><p className="text-sm font-medium">Star a document to add it to your secure favorites.</p></div>
                                ) : (
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left border-collapse">
                                            <thead><tr className="bg-gray-50/50 text-gray-500 text-xs uppercase tracking-widest font-bold"><th className="p-5 w-14 text-center"><i className="fa-solid fa-star text-yellow-400"></i></th><th className="p-5">Name</th><th className="p-5">Sector</th><th className="p-5">Date</th><th className="p-5 text-right pr-8">Actions</th></tr></thead>
                                            <tbody>
                                                {favoriteDocs.map(doc => {
                                                    const sectorData = appSectors.find(s => s.name === doc.category) || appSectors[0];
                                                    const isDeleting = animatingIds.delete.includes(doc.id);
                                                    return (
                                                        <tr key={doc.id} className={`border-t border-gray-50 cursor-pointer table-row-animated ${isDeleting ? 'animate-delete' : ''}`} onClick={() => setViewingDoc(doc)}>
                                                            <td className="p-5 text-center" onClick={e => e.stopPropagation()}><button onClick={(e) => toggleFavorite(e, doc.id)} className="text-gray-300 hover:text-yellow-400 focus:outline-none transition-colors"><i className={`fa-star text-xl ${doc.isFavorite ? 'fa-solid text-yellow-400' : 'fa-regular'}`}></i></button></td>
                                                            <td className="p-5 pl-2 flex items-center w-1/2">
                                                                <div className={`w-10 h-10 flex-shrink-0 rounded-xl flex items-center justify-center mr-4 shadow-sm ${doc.name.includes('.pdf') ? 'bg-red-50 text-red-500 border border-red-100' : 'bg-green-50 text-green-500 border border-green-100'}`}><i className={`fa-solid fa-file${doc.name.includes('.pdf') ? '-pdf' : '-image'} text-lg`}></i></div>
                                                                
                                                                {renamingDocId === doc.id ? (
                                                                    <div className="flex items-center w-full relative" onClick={e => e.stopPropagation()}>
                                                                        <input 
                                                                            type="text" 
                                                                            value={newDocName} 
                                                                            onChange={(e) => setNewDocName(e.target.value)}
                                                                            className="w-full px-3 py-1.5 border-2 border-blue-400 rounded-lg focus:outline-none text-sm font-bold text-gray-900 pr-16 bg-white shadow-sm"
                                                                            autoFocus
                                                                            onKeyDown={(e) => { if(e.key === 'Enter') saveRename(e, doc.id); if(e.key === 'Escape') cancelRename(e); }}
                                                                        />
                                                                        <div className="absolute right-1 flex gap-1">
                                                                            <button onClick={(e) => saveRename(e, doc.id)} className="w-6 h-6 bg-blue-100 text-blue-600 rounded hover:bg-blue-200"><i className="fa-solid fa-check text-xs"></i></button>
                                                                            <button onClick={cancelRename} className="w-6 h-6 bg-gray-100 text-gray-500 rounded hover:bg-gray-200"><i className="fa-solid fa-xmark text-xs"></i></button>
                                                                        </div>
                                                                    </div>
                                                                ) : (
                                                                    <span className="font-bold text-gray-900 truncate">{doc.name}</span>
                                                                )}
                                                            </td>
                                                            <td className="p-5"><span className={`px-3 py-1.5 rounded-lg text-xs font-bold flex items-center w-max ${sectorData.bg} ${sectorData.color}`}><i className={`fa-solid ${sectorData.icon} mr-2`}></i>{doc.category}</span></td>
                                                            <td className="p-5 text-gray-500 text-sm font-medium">{doc.date}</td>
                                                            <td className="p-5 text-right pr-6 whitespace-nowrap" onClick={e => e.stopPropagation()}>
                                                                <button onClick={(e) => startRename(e, doc.id, doc.name)} className="text-gray-400 hover:text-amber-500 hover:bg-amber-50 w-10 h-10 rounded-xl transition-all btn-action-hover mx-1" title="Rename"><i className="fa-solid fa-pen"></i></button>
                                                                <button onClick={(e) => {e.stopPropagation(); setViewingDoc(doc);}} className="text-gray-400 hover:text-blue-600 hover:bg-blue-50 w-10 h-10 rounded-xl transition-all btn-action-hover mx-1"><i className="fa-regular fa-eye"></i></button>
                                                                <button onClick={(e) => moveToTrash(e, doc.id)} className="text-gray-400 hover:text-red-600 hover:bg-red-50 w-10 h-10 rounded-xl transition-all btn-action-hover mx-1" title="Move to Recycle Bin"><i className="fa-solid fa-trash"></i></button>
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                )}
                            </div>
                        )}

                        {currentView === 'trash' && (
                            <div className="bg-white rounded-3xl shadow-xl border border-gray-100 overflow-hidden">
                                <div className="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                                    <div><h3 className="text-xl font-extrabold text-gray-900">Recycle Bin</h3><p className="text-sm font-medium text-gray-500 mt-1">Pending permanent wipe or restore.</p></div>
                                    {trashDocuments.length > 0 && <button onClick={emptyTrash} className="bg-red-50 text-red-600 px-5 py-2.5 rounded-xl hover:bg-red-100 hover:text-red-700 font-bold transition-colors text-sm flex items-center shadow-sm"><i className="fa-solid fa-triangle-exclamation mr-2"></i> Purge All</button>}
                                </div>
                                {trashDocuments.length === 0 ? (
                                    <div className="p-20 text-center text-gray-500"><i className="fa-solid fa-check-double text-6xl mb-5 text-green-400"></i><p className="text-xl font-extrabold text-gray-800 mb-2">Recycle Bin is Empty</p><p className="text-sm font-medium">No deleted documents to restore or purge.</p></div>
                                ) : (
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left border-collapse">
                                            <thead><tr className="bg-gray-50/50 text-gray-500 text-xs uppercase tracking-widest font-bold"><th className="p-5 pl-8">Name</th><th className="p-5">Sector</th><th className="p-5 text-right pr-8">Actions</th></tr></thead>
                                            <tbody>
                                                {trashDocuments.map(doc => {
                                                    const sectorData = appSectors.find(s => s.name === doc.category) || appSectors[0];
                                                    const isDeleting = animatingIds.delete.includes(doc.id);
                                                    const isRestoring = animatingIds.restore.includes(doc.id);
                                                    let animationClass = isDeleting ? 'animate-delete' : isRestoring ? 'animate-restore' : '';
                                                    
                                                    return (
                                                        <tr key={doc.id} className={`border-t border-gray-100 hover:bg-red-50/20 transition-colors opacity-80 ${animationClass}`}>
                                                            <td className="p-5 pl-8 flex items-center"><div className={`w-10 h-10 flex-shrink-0 rounded-xl flex items-center justify-center mr-4 bg-gray-100 text-gray-400`}><i className={`fa-solid fa-file${doc.name.includes('.pdf') ? '-pdf' : '-image'} text-lg`}></i></div><span className="font-bold text-gray-600 line-through truncate">{doc.name}</span></td>
                                                            <td className="p-5"><span className={`px-3 py-1.5 rounded-lg text-xs font-bold flex items-center w-max bg-gray-100 text-gray-500`}><i className={`fa-solid ${sectorData.icon} mr-2`}></i>{doc.category}</span></td>
                                                            <td className="p-5 text-right pr-6 flex justify-end gap-2">
                                                                <button onClick={(e) => restoreFromTrash(e, doc.id)} className="text-emerald-600 bg-emerald-50 px-4 py-2 rounded-xl hover:bg-emerald-100 font-bold transition-colors text-sm"><i className="fa-solid fa-rotate-left mr-2"></i> Restore</button>
                                                                <button onClick={(e) => permanentlyDelete(e, doc.id)} className="text-red-600 bg-red-50 px-4 py-2 rounded-xl hover:bg-red-100 font-bold transition-colors text-sm"><i className="fa-solid fa-ban mr-2"></i> Purge</button>
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const App = () => {
            const [showSplash, setShowSplash] = useState(true);
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [currentUser, setCurrentUser] = useState(null);

            // Listen for Firebase Auth state changes
            useEffect(() => {
                if (fbAuth) {
                    const unsubscribe = fbAuth.onAuthStateChanged((user) => {
                        if (user) {
                            setCurrentUser({
                                id: user.uid,
                                email: user.email,
                                name: user.displayName || (user.email ? user.email.split('@')[0] : 'Agent'),
                                avatar: user.photoURL,
                                isGoogle: user.providerData && user.providerData.some(p => p.providerId === 'google.com')
                            });
                            setIsAuthenticated(true);
                        } else {
                            setCurrentUser(null);
                            setIsAuthenticated(false);
                        }
                    });
                    return () => unsubscribe();
                }
            }, []);

            const handleLogout = async () => {
                if (fbAuth) {
                    try {
                        await fbAuth.signOut();
                    } catch (e) {
                        console.warn("SignOut error:", e);
                    }
                }
                setIsAuthenticated(false);
                setCurrentUser(null);
            };

            if (showSplash) { return <SplashScreen onComplete={() => setShowSplash(false)} />; }
            if (!isAuthenticated) { 
                return <AuthScreen onLogin={(userObj) => { setCurrentUser(userObj); setIsAuthenticated(true); }} />; 
            }
            return <Dashboard user={currentUser} onLogout={handleLogout} onSwitchUser={(newUser) => setCurrentUser(newUser)} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
